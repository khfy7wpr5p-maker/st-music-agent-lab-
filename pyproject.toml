[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "st-music-agent"
version = "0.4.0"
description = "Model-agnostic orchestration core for ST music engineering agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ST Music" }]
dependencies = []

[project.scripts]
st-music-agent = "st_music_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
